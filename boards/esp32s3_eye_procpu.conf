# ESP32-S3-EYE: OV2640 over the LCD_CAM DVP interface.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=64

# The ~240 KB tensor arena does not fit in internal SRAM next to the rest of the
# application, so hand all Edge Impulse allocations to the PSRAM heap.
CONFIG_EI_HEAP_SHARED_MULTI_HEAP=y
CONFIG_EI_HEAP_SMH_ATTRIBUTE=2
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Camera buffers stay in internal SRAM, in their own pool. They must NOT share
# the PSRAM shared-multi-heap with the Edge Impulse allocations above: the GDMA
# writes into these buffers while the CPU allocates and frees EI blocks around
# them, and chunk headers next to a DMA target get smashed. Internal SRAM is
# also uncached on the S3, so there is no DMA/cache hazard either.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=104448
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32

# The LCD_CAM DVP path reports RGBP but delivers the high byte first; without
# this the frame comes out as rainbow bands. Verified by dumping a raw frame.
CONFIG_EI_CAMERA_RGB565_BYTE_SWAP=y

# The OV2640 is mounted upside down on this board
# video_esp32_dvp dies if its input queue ever empties; only stream while grabbing
CONFIG_EI_CAMERA_STREAM_PER_FRAME=y

CONFIG_EI_CAMERA_VFLIP=y

# The OV2640 driver only accepts the exact sizes in its caps table (no stepping),
# so the choices below QVGA are 160x120, 176x144 and 240x240. 240x240 is the only
# square one, but two of those buffers is 230 KB and leaves internal SRAM at 96%
# full; 176x144 leaves ~37% free. Both are wider than the 96x96 model input.
CONFIG_EI_CAMERA_WIDTH=176
CONFIG_EI_CAMERA_HEIGHT=144
