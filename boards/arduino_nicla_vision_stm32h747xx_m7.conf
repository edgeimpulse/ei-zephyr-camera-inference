CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=100000

CONFIG_VIDEO_FRAME_WIDTH=160
CONFIG_VIDEO_FRAME_HEIGHT=120
CONFIG_VIDEO_PIXEL_FORMAT="RGB565"

CONFIG_HEAP_MEM_POOL_SIZE=163840
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768

CONFIG_DMA=y
CONFIG_MAIN_STACK_SIZE=4096

# Console via UART instead of USB
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
