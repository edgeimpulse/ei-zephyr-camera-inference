CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
# Use full Newlib C library for camera inference
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_FPU=y

CONFIG_MAIN_STACK_SIZE=4096

#CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_HEAP_MEM_POOL_SIZE=262144

# Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y

# Camera support configuration
CONFIG_VIDEO=y
