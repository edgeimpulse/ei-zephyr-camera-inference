CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=460800

# Video buffers live in the octal PSRAM, not in internal SRAM
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=230400

CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=64

# The sensor is mounted upside down on this module
CONFIG_EI_CAMERA_VFLIP=y
