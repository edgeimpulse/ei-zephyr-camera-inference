#CONFIG_INFERENCE_BUFFER_SECTION_NAME=".ext_ram.bss"
# use shared heap for ei_malloc/ei_free
#CONFIG_USE_SHARED_MULTI_HEAP=y
#CONFIG_USE_EXTERNAL_HEAP=y
#CONFIG_USE_EXTERNAL_HEAP_SECTION_NAME=".ext_ram.bss"
#CONFIG_USE_EXTERNAL_HEAP_SIZE=196608

CONFIG_INFERENCE_BUFFER_USE_SECTION=y
CONFIG_INFERENCE_BUFFER_SECTION_NAME=".ext_ram.bss"
