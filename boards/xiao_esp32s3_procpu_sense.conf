# Seeed XIAO ESP32S3 Sense - OV2640 camera on the LCD_CAM DVP interface.
# Build with sysbuild so MCUboot is built alongside the app:
#   west build --sysbuild -p -b xiao_esp32s3/esp32s3/procpu/sense .

CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_ESP_SPIRAM=y
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=230400

CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=64
