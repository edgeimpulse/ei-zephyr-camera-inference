CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y

# Stack sizes - increased for TensorFlow Lite inference
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=2048

# Heap - increased for ML operations
CONFIG_HEAP_MEM_POOL_SIZE=262144

CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y

# Logging
#CONFIG_LOG=y
#CONFIG_ASSERT=y
#CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y

# Camera support configuration
CONFIG_VIDEO=y

CONFIG_DMA=y

# capture format
#CONFIG_VIDEO_PIXEL_FORMAT="RGBP"
# config if you need to locate the video buffer pool in a specific memory region
# ie for esp32s3-eyes use the external ram

# ESP32-S3 SPIRAM malloc support

# Disable excessive logging that might slow things down
CONFIG_VIDEO_LOG_LEVEL_INF=y
CONFIG_I2C_LOG_LEVEL_INF=y
CONFIG_DMA_LOG_LEVEL_INF=y

# Increase watchdog timeout
CONFIG_TASK_WDT=n
