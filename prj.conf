CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_FPU=y

#CONFIG_MAIN_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

# Logging
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
# 1024 is not enough for the camera capability listing at boot; it drops messages
CONFIG_LOG_BUFFER_SIZE=4096

# The model allocates its tensor arena from the heap on the first inference.
# It must be larger than EI_CLASSIFIER_TFLITE_LARGEST_ARENA_SIZE in
# model-parameters/model_metadata.h, plus room for the smaller SDK allocations.
# Boards that enable CONFIG_EI_HEAP_SHARED_MULTI_HEAP override this back down.
CONFIG_HEAP_MEM_POOL_SIZE=278528

# Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y
# 0: malloc/free, 1: k_malloc/k_free
CONFIG_EDGE_IMPULSE_HEAP_TYPE=1

# Camera capture
CONFIG_VIDEO=y
CONFIG_I2C=y
# The video buffer pool must hold CONFIG_EI_CAMERA_NUM_BUFS frames of
# CONFIG_EI_CAMERA_WIDTH x CONFIG_EI_CAMERA_HEIGHT x 2 bytes; override per board.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=80000
