# Arduino Nicla Vision: GC2145 over DCMI.
# The M7 only has 512 KB of AXI SRAM and the tensor arena already takes ~240 KB
# of it, so capture at the smallest resolution the GC2145 supports.
CONFIG_DMA=y

# The video buffers MUST live in the D2 domain. DMA1/DMA2 on the STM32H7 sit in
# D2, and a buffer in the default D1 AXI SRAM (0x24000000) leaves the DCMI DMA
# armed but never completing -- no error, just no frames. SRAM1 is at 0x30000000
# in D2. This also takes the buffers out of the 512 KB the tensor arena competes
# for.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM1"
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=160000
CONFIG_EI_CAMERA_NUM_BUFS=1

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Route LOG_* through printk. The console is USB CDC ACM and the board's CDC
# defconfig sets LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000 to wait for the host
# to enumerate; with the default deferred mode everything logged during start up
# sits in the ring buffer for four seconds and is lost if anything goes wrong
# before it drains. Minimal mode has no thread and no buffer.
CONFIG_LOG_MODE_MINIMAL=y

# Predicted from the driver source, NOT verified on hardware: gc2145_set_output_format()
# only sets GC2145_REG_BYPASS_MODE_SWITCH (which makes the sensor emit little endian
# RGB565) when bus_type == CSI2_DPHY. This board's dcmi endpoint has no bus-type
# property so it defaults to PARALLEL, the switch bit is never set, and STM32 DCMI
# packs bytes in arrival order (ByteSelectMode = DCMI_BSM_ALL). If the image comes out
# with correct shapes but rainbow colour bands, this got it backwards -- drop the line.
CONFIG_EI_CAMERA_RGB565_BYTE_SWAP=y

# 320x240 is a real discrete mode and gives roughly twice the field of view of
# 160x120: gc2145_set_resolution() clamps its ratio to 3, so the sensor window is
# 960x720 here versus only 480x360 at 160x120.
# The GC2145 is mounted rotated 180 degrees on this board: without both flips
# the frame comes out upside down (verified by dumping the model input).
CONFIG_EI_CAMERA_HFLIP=y
CONFIG_EI_CAMERA_VFLIP=y

CONFIG_EI_CAMERA_WIDTH=320
CONFIG_EI_CAMERA_HEIGHT=240
