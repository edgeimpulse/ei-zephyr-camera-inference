CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_FPU=y

CONFIG_MAIN_STACK_SIZE=8192

# Logging
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# Holds the RGB888 working frame (capture_w * capture_h * 3). Raise it if you
# capture at a higher resolution than the 96x96..160x120 class of defaults.
CONFIG_HEAP_MEM_POOL_SIZE=131072

# Camera. The video buffer pool is separate from the kernel heap and must hold
# CONFIG_EI_CAMERA_NUM_BUFS raw frames, so it is sized per board in
# boards/<board>.conf.
CONFIG_VIDEO=y
CONFIG_I2C=y

# Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y
# 0: malloc/free, 1: k_malloc/k_free
CONFIG_EDGE_IMPULSE_HEAP_TYPE=1
